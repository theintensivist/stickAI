; stickAI - Gemini voice assistant for the M5Stack StickS3
; Build & flash:  pio run -t upload      Serial log:  pio device monitor

[platformio]
default_envs = m5stack-sticks3

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; StickS3 = ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; Gemini can send audio in large WebSocket messages; bigger ones would silently drop the connection
  -DWEBSOCKETS_MAX_DATA_SIZE=524288
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  https://github.com/m5stack/M5GFX.git#0.3.0
  https://github.com/m5stack/M5Unified.git#0.3.0
  bblanchon/ArduinoJson@^7.4.2
