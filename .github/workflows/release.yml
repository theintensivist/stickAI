# Builds the firmware from source and publishes a GitHub release with
# ready-to-flash files. Two ways to start it:
#   - push a version tag, e.g. v0.11.0
#   - Actions tab > "Build and release firmware" > Run workflow, and type a
#     version such as 0.11.0 (leave it empty to only build and check)
name: Build and release firmware

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.11.0 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio "esptool<5"

      - name: Build
        run: pio run

      - name: Make flashable files
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          B=.pio/build/m5stack-sticks3
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"
          else V="dev"; fi
          if ! echo "$V" | grep -qE '^[0-9A-Za-z.-]+$'; then echo "::error::Version can only contain letters, digits, dots and dashes"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p out
          esptool.py --chip esp32s3 merge_bin -o "out/stickai-v${V}-full.bin" \
            --flash_mode keep --flash_freq keep --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT_APP0 0x10000 $B/firmware.bin
          cp $B/firmware.bin "out/stickai-v${V}-update.bin"
          (cd out && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Safety net: never publish a firmware file that contains a Gemini API key
          if strings -n 8 out/*.bin | grep -qE 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "::error::An API key was found in the firmware. Not publishing."; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stickai-firmware
          path: out/*

      - name: Publish release
        if: env.VERSION != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "stickAI ${{ env.VERSION }}"
          body_path: .github/release-notes.md
          files: out/*
